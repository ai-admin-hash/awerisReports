support pack that describes the transcript-to-model path is given to each clinic before it switches the feature on, and Aweris answers the clinic's security and DPIA questions on that path.", "Aweris gives each clinic the information on the summary processing it needs to check Aweris's processor duties, allows audits and inspections by the clinic or its auditor, and tells the clinic at once when it thinks an instruction infringes data protection law.", "For a client's rights request the clinic can find, export, correct or delete that client's transcripts, pending drafts and saved summaries; a correction to an approved summary is saved as a new dated version by the clinic, and Aweris carries out the clinic's instruction on any of the three within the period the processor agreement sets and confirms it to the clinic.", "The 30-day draft period is the clinic's documented instruction, recorded in the processor agreement annex with the purpose the clinic states for it; a clinic can set a shorter period, and a written hold instruction from the clinic pauses deletion of the drafts it names until the clinic lifts it."]}, {"area": "AREA-HEALTH", "controls": ["The feature is offered as an aid to the clinic's own record-keeping for the treating psychologist only; no other use of the transcript is made.", "Only persons under a professional or contractual duty of secrecy (psychologists, Aweris staff with confidentiality undertakings, Google under its data processing terms) handle the transcripts.", "A clinic-level and client-level switch lets the clinic leave out clients for whom it decides not to use the feature.", "Aweris supplies clinics with a privacy statement text that names the summary step and the model provider as recipient category.", "The psychologist's review lets the psychologist leave out details about other persons (partners, relatives) that the note does not need.", "The saved summary is used as dossier documentation only; the feature feeds no automated decision about the client.", "Where the clinic acts towards the representative of an adult client who cannot reasonably judge their interests, the client-level switch and the information to the client follow the clinic's record of that representative (wgbo#art_465).", "The summary step cannot be switched on for a clinic until the clinic confirms in the admin settings that its DPIA for the summary step is done; Aweris supplies the DPIA support pack first."]}, {"area": "AREA-DOSSIER", "controls": ["Nothing enters the client file without the psychologist's approval; at approval the psychologist checks that the summary holds only what good care needs and removes the rest; the saved entry records the approving psychologist and the date.", "Approved summaries are kept for the retention period the clinic sets: at least twenty years from the last change, or longer as the clinic instructs where good care requires it; they are deleted earlier only on the clinic's instruction, such as a client's destruction request the clinic has accepted, or after a confirmed export to its EPD.", "Reads and writes of transcripts, drafts and summaries, including each opening in the review screen, are logged per user and client, and the logs are available to the clinic. The logs are used for security and the clinic's access checks, not to monitor staff performance; another use needs the clinic's own decision.", "The clinic can export an approved summary to its EPD with its approval data (approving psychologist, date, AI provenance flag); deletion after export happens only after the clinic confirms the summary is in its EPD, and a failed or unconfirmed export keeps the summary in the platform.", "On the clinic's instruction after a client's destruction request, Aweris deletes the saved summary and any remaining drafts of that session and confirms the deletion to the clinic.", "The clinic can retrieve and export all saved summaries of a client to answer an access or copy request, as an electronic copy at no charge to the client, with, at the client's request, the access log entries showing who viewed or requested them and when; the clinic can leave out passages before release where another person's privacy requires it."]}], "switched_off": ["AREA-MD", "AREA-CYBER", "AREA-DEVICE", "AREA-CRA"], "alternative": "Save only approved summaries with access logging and retention settings, and settle the intended-purpose statement (GQ-MDR), the health data ground (GQ-GROUND), the confidentiality reading (GQ-CONF), whether the platform file is a care information system (GQ-BEGZ), the transfer review (GQ-TRANSFER), Aweris's own Cbw status (GQ-CBW-AWERIS) and the CRA reading (GQ-CRA) before release.", "needs": ["GQ-MDR", "GQ-CONF", "GQ-GROUND", "GQ-BEGZ", "GQ-TRANSFER", "GQ-CYBER", "GQ-DEVICE", "GQ-CRA", "GQ-CBW-AWERIS"]}], "areas": [{"id": "AREA-PROC", "status": "applies", "stance": "Allows, with requirements", "name": "Aweris as processor for your clinic", "effect": "Allows, with requirements. Aweris acts for your clinic, so it needs a processor agreement naming Google as sub-processor, security measures, and a record of processing for the transcript flow.", "laws": [{"claim_id": "PR-1", "effect": "Requires", "text": "Aweris may use Google Vertex AI as a further processor for the transcripts only with the clinic's prior specific or general written authorisation; where the authorisation is general, Aweris must tell the clinic of any intended addition or replacement of processors so it can object.", "refs": [1], "quote": "The processor shall not engage another processor without prior specific or general written authorisation of the controller."}, {"claim_id": "PR-2", "effect": "Requires", "text": "The data protection duties Aweris owes the clinic must be imposed on Google by contract for the model calls.", "refs": [1], "quote": "the same data protection obligations as set out in the contract or other legal act between the controller and the processor as referred to in paragraph 3 shall be imposed on that other processor by way of a contract or other legal act under Union or Member State law"}, {"claim_id": "PR-3", "effect": "Requires", "text": "The processor agreement must bind Aweris to process transcripts, drafts and summaries only on the clinic's documented instructions, unless EU or Dutch law requires Aweris to process them; Aweris then tells the clinic of that legal requirement before processing, unless that law bars this information on important grounds of public interest.", "refs": [1], "quote": "processes the personal data only on documented instructions from the controller"}, {"claim_id": "PR-4", "effect": "Requires", "text": "Aweris must ensure that the people who can reach transcripts and summaries are bound to confidentiality.", "refs": [1], "quote": "ensures that persons authorised to process the personal data have committed themselves to confidentiality or are under an appropriate statutory obligation of confidentiality"}, {"claim_id": "PR-5", "effect": "Requires", "text": "Aweris as processor must apply security measures that fit the risk of sending therapy transcripts to a language model and storing drafts and summaries.", "refs": [2], "quote": "the controller and the processor shall implement appropriate technical and organisational measures to ensure a level of security appropriate to the risk"}, {"claim_id": "PR-6", "effect": "Requires", "text": "Aweris must keep a processor record that covers the summary processing for each clinic. The exemption for organisations with fewer than 250 persons does not apply where the processing includes special categories of data; the transcripts are health data, so the small size of Aweris (P7-size) does not lift the duty.", "refs": [3], "quote": "Each processor and, where applicable, the processor's representative shall maintain a record of all categories of processing activities carried out on behalf of a controller"}, {"claim_id": "PR-7", "effect": "Requires", "text": "Aweris must help each clinic with its security and DPIA duties for this new processing of health data, using the information Aweris holds about the model path.", "refs": [1], "quote": "assists the controller in ensuring compliance with the obligations pursuant to Articles 32 to 36 taking into account the nature of processing and the information available to the processor"}, {"claim_id": "PR-8", "effect": "Requires", "text": "Aweris as processor must tell the clinic without undue delay when it becomes aware of a personal data breach of transcripts, drafts or summaries, including a breach Google reports to Aweris.", "refs": [4], "quote": "The processor shall notify the controller without undue delay after becoming aware of a personal data breach."}, {"claim_id": "PR-9", "effect": "Requires", "text": "The processor agreement must bind Aweris to delete or return, at the clinic's choice, the transcripts, drafts and saved summaries when the service ends, and to delete remaining copies unless EU or Dutch law requires Aweris to store them.", "refs": [1], "quote": "at the choice of the controller, deletes or returns all the personal data to the controller after the end of the provision of services relating to processing"}, {"claim_id": "PR-10", "effect": "Sets the scope", "text": "Chapter V applies to a transfer to a third country or to an international organisation, including onward transfers. The Vertex AI project is set to EU data residency and EU machine-learning processing (P6-eu-hosting and the control below), but location settings alone do not show that no Google entity or sub-processor outside the EU receives or can access the transcripts; whether the model calls involve a transfer stays open until the privacy officer has checked the provider terms, recipients, access arrangements and configuration (GQ-TRANSFER).", "refs": [5], "quote": "Any transfer of personal data which are undergoing processing or are intended for processing after transfer to a third country or to an international organisation shall take place only if, subject to the other provisions of this Regulation, the conditions laid down in this Chapter are complied with by the controller and processor"}, {"claim_id": "PR-11", "effect": "Requires", "text": "The processor agreement must bind Aweris to make available to the clinic the information needed to show it meets its processor duties for the summary processing and to allow and contribute to audits, including inspections, by the clinic or its auditor; Aweris must tell the clinic at once when it thinks an instruction infringes data protection law.", "refs": [1], "quote": "makes available to the controller all information necessary to demonstrate compliance with the obligations laid down in this Article and allow for and contribute to audits, including inspections, conducted by the controller or another auditor mandated by the controller."}, {"claim_id": "PR-12", "effect": "Requires", "text": "The processor agreement must bind Aweris to help each clinic, by technical and organisational measures as far as possible, answer client requests to exercise their rights (access, copy, rectification, erasure, restriction, objection), for transcripts, drafts and saved summaries alike.", "refs": [1], "quote": "taking into account the nature of the processing, assists the controller by appropriate technical and organisational measures, insofar as this is possible, for the fulfilment of the controller's obligation to respond to requests for exercising the data subject's rights laid down in Chapter III"}]}, {"id": "AREA-HEALTH", "status": "applies", "stance": "Allows, with requirements", "name": "Health data and confidentiality", "effect": "Allows, with requirements. Transcripts are health data. Your clinic needs a recorded care ground, a confidentiality reading and its own DPIA before switch-on; Aweris supplies a privacy statement text and a DPIA support pack.", "laws": [{"claim_id": "HD-1", "effect": "Allows", "text": "The Dutch exception lets care providers process health data where this is needed for good treatment or care of the client or for managing the practice; whether drafting the summary with a model is needed in that sense is the clinic's assessment.", "refs": [6], "quote": "hulpverleners, instellingen of voorzieningen voor gezondheidszorg of maatschappelijke dienstverlening, voor zover de verwerking noodzakelijk is met het oog op een goede behandeling of verzorging van de betrokkene dan wel het beheer van de betreffende instelling of beroepspraktijk"}, {"claim_id": "HD-2", "effect": "Requires", "text": "Where the clinic relies on that exception, only persons bound to secrecy by profession, law or a confidentiality agreement may process the transcripts, which reaches Aweris staff and the model provider.", "refs": [6], "quote": "worden de gegevens alleen verwerkt door personen die uit hoofde van ambt, beroep of wettelijk voorschrift dan wel krachtens een overeenkomst tot geheimhouding zijn verplicht"}, {"claim_id": "HD-3", "effect": "Requires", "text": "The clinic as care provider must see to it that no information about the client goes to others than the client without consent, unless a statutory rule obliges the disclosure. This binds the summary step if the processor chain counts as others (GQ-CONF, second answer): client consent is then needed before the transcript goes to Aweris and Google.", "refs": [7], "quote": "draagt de hulpverlener zorg, dat aan anderen dan de patiënt geen inlichtingen over de patiënt dan wel inzage in of afschrift van de gegevens uit het dossier worden verstrekt dan met toestemming van de patiënt."}, {"claim_id": "HD-4", "effect": "Requires", "text": "The clinic must tell clients about the processing when it collects their data, including the recipients, except insofar as the client already has the information; the summary step and the model provider are new, so the clinic checks which of this information its clients do not yet have.", "refs": [8], "quote": "Where personal data relating to a data subject are collected from the data subject, the controller shall, at the time when personal data are obtained, provide the data subject with all of the following information:"}, {"claim_id": "HD-5", "effect": "Requires", "text": "Where information about the client goes to others, it may go only insofar as this does not harm the privacy of another person. Transcripts often mention partners, relatives or others; if the processor chain counts as others (GQ-CONF, second answer), the clinic's decision record covers how such mentions are handled in the summary step.", "refs": [7], "quote": "Indien verstrekking plaatsvindt, geschiedt deze slechts voor zover daardoor de persoonlijke levenssfeer van een ander niet wordt geschaad."}, {"claim_id": "HD-6", "effect": "Sets the scope", "text": "Article 22 gives the client a right not to be subject to a decision based solely on automated processing with legal or similarly significant effects. The feature takes no decision: it drafts a text that the psychologist edits and approves, and nothing is saved without that approval (brief: human involvement); the saved summary is dossier documentation. Using saved summaries to take decisions about clients is outside this brief and needs a new check.", "refs": [9], "quote": "The data subject shall have the right not to be subject to a decision based solely on automated processing, including profiling, which produces legal effects concerning him or her or similarly significantly affects him or her."}, {"claim_id": "HD-7", "effect": "Sets the scope", "text": "The transcripts, drafts and summaries are data concerning health, whose processing the GDPR prohibits unless an exception of Article 9(2) applies. The ground the clinic relies on is point (h), care or treatment on the basis of Member State law and subject to professional secrecy, given effect in the Netherlands by the care exception of uavg#art_30 (HD-1, HD-2). Whether the clinic can rely on it for the summary step is GQ-GROUND; without a ground the summary step is not switched on for that clinic.", "refs": [10], "quote": "Processing of personal data revealing racial or ethnic origin, political opinions, religious or philosophical beliefs, or trade union membership, and the processing of genetic data, biometric data for the purpose of uniquely identifying a natural person, data concerning health or data concerning a natural person's sex life or sexual orientation shall be prohibited."}, {"claim_id": "HD-8", "effect": "Requires", "text": "Each clinic as controller must carry out a data protection impact assessment before the summary step starts where the processing, in particular with new technology, is likely to result in a high risk; Article 35 names large-scale processing of health data as one such case. Sending therapy session transcripts to a language model is new technology applied to health data, so the feature is designed on the basis that each clinic needs a DPIA; whether its own processing is large scale or high risk is the clinic's assessment, recorded in that DPIA. Aweris supports it with its DPIA support pack (PR-7).", "refs": [11], "quote": "Where a type of processing in particular using new technologies, and taking into account the nature, scope, context and purposes of the processing, is likely to result in a high risk to the rights and freedoms of natural persons, the controller shall, prior to the processing, carry out an assessment of the impact of the envisaged processing operations on the protection of personal data."}]}, {"id": "AREA-DOSSIER", "status": "may", "stance": "Open to interpretation", "name": "Client file, retention and logging", "effect": "Open to interpretation. It turns on whether the platform client file counts as part of your care information system. Either way the clinic keeps a dossier, and the approved summary must hold only what good care needs.", "laws": [{"claim_id": "DS-1", "effect": "Requires", "text": "The clinic must keep a dossier on the client's treatment and record in it health data, actions and other data only insofar as this is needed for good care; the approved summary becomes part of it, so at approval the psychologist checks that the summary holds only what good care needs.", "refs": [12], "quote": "De hulpverlener richt een dossier in met betrekking tot de behandeling van de patiënt."}, {"claim_id": "DS-2", "effect": "Requires", "text": "Without prejudice to the destruction rule of Article 455, the clinic must keep the dossier for twenty years from the last change, or longer where good care reasonably requires it, so the platform keeps approved summaries for the period the clinic sets or lets the clinic move them to its EPD.", "refs": [12], "quote": "Onverminderd het bepaalde in artikel 455 bewaart de hulpverlener het dossier gedurende twintig jaren, te rekenen vanaf het tijdstip waarop de laatste wijziging in het dossier heeft plaatsgevonden, of zoveel langer als redelijkerwijs uit de zorg van een goed hulpverlener voortvloeit."}, {"claim_id": "DS-3", "effect": "Requires", "text": "If the platform client file is part of the clinic's care information system (GQ-BEGZ), the clinic must make sure its logging meets NEN 7513, and Aweris supplies that logging as processor. The norm is named, not reproduced.", "refs": [13], "quote": "De zorgaanbieder als verantwoordelijke voor een zorginformatiesysteem en de verantwoordelijke voor een elektronisch uitwisselingssysteem dragen er zorg voor dat de logging van het systeem voldoet aan het bepaalde in NEN 7513."}, {"claim_id": "DS-4", "effect": "Requires", "text": "If the platform client file is part of the clinic's care information system (GQ-BEGZ), the clinic must use it securely in line with NEN 7510 and NEN 7512, and Aweris supplies the security description it needs. The norms are named, not reproduced.", "refs": [14], "quote": "Een zorgaanbieder draagt overeenkomstig het bepaalde in NEN 7510 en NEN 7512, zorg voor een veilig en zorgvuldig gebruik van het zorginformatiesysteem"}, {"claim_id": "DS-5", "effect": "Requires", "text": "On a written or electronic request of the client, the clinic must destroy the dossier data, which reaches saved summaries; this does not hold insofar as keeping them is of substantial importance to someone else or a statutory rule bars destruction, which the clinic decides.", "refs": [15], "quote": "De hulpverlener vernietigt de gegevens uit het dossier na een daartoe strekkend schriftelijk of elektronisch verzoek van de patiënt."}, {"claim_id": "DS-6", "effect": "Requires", "text": "On request the clinic must give the client access to and a copy of the dossier data, which includes saved summaries, except insofar as withholding is needed to protect another person's privacy, which the clinic decides; Aweris supports this as processor.", "refs": [16], "quote": "De hulpverlener verstrekt aan de patiënt desgevraagd inzage in en afschrift van de gegevens uit het dossier."}, {"claim_id": "DS-7", "effect": "Requires", "text": "On the client's request the clinic must give access to or a copy of the client's dossier, which includes saved summaries, in electronic form, at reasonable intervals and free of charge; Aweris supports this as processor.", "refs": [17], "quote": "Indien de cliënt verzoekt om inzage of afschrift van het dossier van de desbetreffende cliënt, of van de gegevens betreffende deze cliënt die de zorgaanbieder via een elektronisch uitwisselingssysteem beschikbaar stelt, wordt de inzage of het afschrift op verzoek van de cliënt, met redelijke tussenpozen, door de zorgaanbieder op elektronische wijze verstrekt."}, {"claim_id": "DS-8", "effect": "Requires", "text": "On the client's request that electronic copy includes who viewed or requested certain information and on which date; for the summaries in the platform the access log supplies this.", "refs": [18], "quote": "wordt in een afschrift als bedoeld in artikel 15d, eerste lid, op verzoek van de cliënt opgenomen:"}, {"claim_id": null, "effect": "Open to interpretation", "text": "Whether the client file in the platform is part of the clinic's zorginformatiesysteem is a legal reading the facts do not settle: P10-record-system makes the clinic EPD the official record, while S3 stores care data at Aweris for the clinic. Gray question GQ-BEGZ carries it.", "refs": [19], "quote": "zorginformatiesysteem: elektronisch systeem van een zorgaanbieder voor het verwerken van persoonsgegevens in een dossier als bedoeld in de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg, niet zijnde een elektronisch uitwisselingssysteem;"}]}, {"id": "AREA-AI", "status": "applies", "stance": "Open to interpretation", "name": "EU AI Act duties of Aweris", "effect": "Open to interpretation. It turns on whether the AI marking duty applies to a session summary or an assistive-editing relief applies. Aweris marks drafts anyway, trains its staff in AI literacy and keeps a quality record.", "laws": [{"claim_id": "AI-1", "effect": "Requires", "text": "Article 50 requires providers of systems that generate text to mark the outputs in a machine-readable way as AI generated, except to the extent the system performs an assistive function for standard editing or does not substantially alter the input (scope check below). This legal duty applies if counsel reads a session summary as outside that relief (GQ-ART50, first answer). Aweris marks the drafts as a chosen design control in either reading, and the marking solution must be effective, interoperable, robust and reliable as far as technically feasible; the marking design and test record must show this before release, and no such record exists yet. Article 50 applies from 2026-08-02 (Article 113, second paragraph, unchanged per the currency record).", "refs": [20], "quote": "Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable format and detectable as artificially generated or manipulated."}, {"claim_id": "AI-2", "effect": "Requires", "text": "Aweris as provider must take measures for the AI literacy of its staff and others who operate the feature on its behalf (Article 4 as replaced by Regulation (EU) 2026/1744).", "refs": [21], "quote": "Providers and deployers of AI systems shall take measures to support the development of AI literacy of their staff and other persons dealing with the operation and use of AI systems on their behalf"}, {"claim_id": "AI-3", "effect": "Sets the scope", "text": "Annex III lists its high-risk areas: biometrics (including emotion recognition, which the definition ties to biometric data), critical infrastructure, education, employment, essential services (including emergency triage and life and health insurance pricing), law enforcement, migration and justice. Drafting a session summary from a text transcript for the treating psychologist falls in none of these areas on the brief, and the model receives text only, no voice, image or video. The Annex I route needs both conditions of Article 6(1): the AI system is intended as a safety component of a product, or is itself a product, covered by the listed legislation such as the MDR (GQ-MDR), and that product must undergo a third-party conformity assessment, which turns on its MDR class and conformity route; the device qualification record checks both alternatives of the first condition and the second. High-risk duties under that route would apply from 2028-08-02 (Article 113, third paragraph, point (c)(ii), as replaced by Regulation (EU) 2026/1744).", "refs": [21, 22, 23, 24], "quote": "that AI system shall be considered to be high-risk where both of the following conditions are fulfilled:"}, {"claim_id": "AI-4", "effect": "Sets the scope", "text": "Article 5 lists prohibited AI practices, among them manipulative techniques, exploiting vulnerabilities, social scoring, crime-risk profiling, facial image scraping and inferring the emotions of persons at work or in education. On the brief the feature drafts a text summary of a care session for the treating psychologist: it scores, profiles or classifies no one and is not used to infer the emotions of workers or students, so it performs none of these practices as proposed; a change of purpose needs a new check.", "refs": [25], "quote": "1. The following AI practices shall be prohibited:"}, {"claim_id": null, "effect": "Open to interpretation", "text": "Whether a session summary falls under this relief is a legal reading the facts do not settle; gray question GQ-ART50 carries it. Marking the drafts is a design control of Aweris in either reading.", "refs": [20], "quote": "This obligation shall not apply to the extent the AI systems perform an assistive function for standard editing or do not substantially alter the input data provided by the deployer or the semantics thereof"}]}, {"id": "AREA-MD", "status": "may", "stance": "Open to interpretation", "name": "Medical device rules", "effect": "Open to interpretation. It turns on the purpose Aweris states: drafting documentation only, or a medical purpose. No intended-purpose statement exists yet.", "laws": [{"claim_id": "MD-1", "effect": "Sets the scope", "text": "Software is a medical device only when the manufacturer intends it for a listed medical purpose; the intended purpose comes from what Aweris states in labels, instructions and sales material.", "refs": [26], "quote": "‘medical device’ means any instrument, apparatus, appliance, software, implant, reagent, material or other article intended by the manufacturer to be used, alone or in combination, for human beings for one or more of the following specific medical purposes:"}, {"claim_id": "MD-2", "effect": "Requires", "text": "If the intended purpose makes the feature a medical device (GQ-MDR), its manufacturer must have designed and built it to the MDR before placing it on the market. Manufacturer status is a separate test under Article 2(30): who manufactures the device or has it designed or manufactured, and markets it under its name or trade mark. Aweris builds the feature and offers it to clinics under the Aweris name (brief; P9-ai-use), and the regulatory affairs owner records these facts in the qualification record before the duty is attributed to Aweris.", "refs": [26, 27], "quote": "When placing their devices on the market or putting them into service, manufacturers shall ensure that they have been designed and manufactured in accordance with the requirements of this Regulation."}, {"claim_id": null, "effect": "Open to interpretation", "text": "Whether the device definition reaches the feature turns on the intended purpose Aweris states; no statement exists yet, so this stays open (GQ-MDR).", "refs": [26], "quote": "‘intended purpose’ means the use for which a device is intended according to the data supplied by the manufacturer on the label, in the instructions for use or in promotional or sales materials or statements and as specified by the manufacturer in the clinical evaluation;"}]}, {"id": "AREA-CYBER", "status": "may", "stance": "Open to interpretation", "name": "Cyber security law (Cbw)", "effect": "Open to interpretation. It turns on whether a clinic using the feature is an important or essential entity, which must then check its suppliers such as Aweris and Google, and on Aweris's own status under the law.", "laws": [{"claim_id": "CY-1", "effect": "Requires", "text": "A clinic that is an important or essential entity must check whether its direct suppliers and service providers, Aweris among them, meet its security requirements, and check this periodically; Aweris supplies what the clinic needs for that check.", "refs": [28], "quote": "De essentiële entiteit of belangrijke entiteit toetst of haar rechtstreekse leveranciers en rechtstreekse dienstverleners, bedoeld in het eerste lid, voldoen aan de beveiligingseisen, bedoeld in artikel 7, vijfde lid."}, {"claim_id": "CY-2", "effect": "Sets the scope", "text": "Under the Cbw, health-sector entities named in its annex 1 are important entities when medium-sized (article 12), essential entities when above the medium-sized threshold (article 8), and can be designated as essential entities by ministerial decision on the criteria of article 9; the healthcare regulation covers the health sector. Whether a clinic that uses the feature is one is a fact of the clinic. P7-size describes Aweris only and says nothing about the clinics.", "refs": [29, 30, 31, 32, 33], "quote": "entiteiten, genoemd in bijlage 1 van deze wet, niet zijnde een essentiële entiteit, die in aanmerking komen als middelgrote onderneming uit hoofde van artikel 2 van de bijlage bij de Aanbeveling 2003/361/EG"}, {"claim_id": "CY-3", "effect": "Sets the scope", "text": "Aweris's own status under the Cbw is a separate question from the clinics'. Entities of annex 1 are essential above the medium-sized threshold (article 8) and important when medium-sized (article 12); small or micro enterprises are reached as important entities only as providers of public electronic communications networks or services or of trust services (article 12, first paragraph, points c to e), and any listed entity can be designated as essential by ministerial decision (article 9). Aweris is a micro-enterprise (P7-size) that offers a hosted platform (P5-saas-only), and this feature adds no communications or trust service; whether Aweris has been designated, or offers such a service with other parts of the platform, is a fact Aweris must record (GQ-CBW-AWERIS).", "refs": [29, 30, 31], "quote": "andere entiteiten, genoemd in bijlage 1 van deze wet, die de in artikel 2, eerste lid, van de bijlage bij Aanbeveling 2003/361/EG bedoelde drempel voor middelgrote ondernemingen overschrijden"}, {"claim_id": null, "effect": "Open to interpretation", "text": "Whether a clinic that uses the feature is an important or essential entity turns on its size or a designation, which the brief and the profile do not state; GQ-CYBER carries it.", "refs": [29], "quote": "entiteiten, genoemd in bijlage 1 van deze wet, niet zijnde een essentiële entiteit, die in aanmerking komen als middelgrote onderneming uit hoofde van artikel 2 van de bijlage bij de Aanbeveling 2003/361/EG"}]}, {"id": "AREA-DEVICE", "status": "may", "stance": "Open to interpretation", "name": "Storage on the user's device", "effect": "Open to interpretation. It turns on whether the summary screens store or read anything on the device beyond what is strictly needed, such as analytics.", "laws": [{"claim_id": "DV-1", "effect": "Requires", "text": "Storing or reading information on the user's device is allowed only after clear and complete information and consent, unless the storage is strictly necessary for the service the user asks for.", "refs": [34], "quote": "Onverminderd de Algemene verordening gegevensbescherming is het via een elektronisch communicatienetwerk opslaan van of toegang verkrijgen tot informatie in de randapparatuur van een gebruiker, alleen toegestaan op voorwaarde dat de betrokken gebruiker:"}, {"claim_id": "DV-2", "effect": "Sets the scope", "text": "Storage or access that is strictly necessary to deliver the service the user asked for is outside the consent rule.", "refs": [34], "quote": "die strikt noodzakelijk is om de door de abonnee of gebruiker gevraagde dienst van de informatiemaatschappij te leveren"}, {"claim_id": null, "effect": "Open to interpretation", "text": "If the summary screens store or read only what is strictly necessary for the service, the consent rule does not apply; the brief does not state what they store, and P5-saas-only (nothing installed) does not settle it. GQ-DEVICE carries it.", "refs": [34], "quote": "Het bepaalde in het eerste lid is niet van toepassing indien het de opslag of toegang betreft:"}]}, {"id": "AREA-CRA", "status": "may", "stance": "Open to interpretation", "name": "Cyber Resilience Act reading", "effect": "Open to interpretation. It turns on whether the hosted platform, or the model call as its remote processing, is a product with digital elements. If it is, Aweris must report exploited vulnerabilities and severe incidents.", "laws": [{"claim_id": "CRA-1", "effect": "Sets the scope", "text": "The CRA applies to products with digital elements made available on the market that connect to a device or network; such a product includes its remote data processing solutions, meaning processing at a distance designed by the manufacturer without which the product could not perform one of its functions. The platform is a hosted web application with nothing installed (P5-saas-only); whether it, or the model call as its remote processing, is a product with digital elements is a reading that this fact does not settle (GQ-CRA). The CRA as a whole applies from 2027-12-11 and the Article 14 reporting duties from 2026-09-11 (Article 71(2), first and second subparagraphs, per the currency record). The CRA does not reach products to which the MDR applies, which matters only if GQ-MDR goes the device way.", "refs": [35, 36], "quote": "This Regulation applies to products with digital elements made available on the market, the intended purpose or reasonably foreseeable use of which includes a direct or indirect logical or physical data connection to a device or network."}, {"claim_id": "CRA-2", "effect": "Requires", "text": "If the platform is a product with digital elements (GQ-CRA, second answer), Aweris as manufacturer must notify actively exploited vulnerabilities in it, and severe incidents that affect its security, to the coordinating CSIRT and to ENISA; this applies from 2026-09-11 (Article 71(2), second subparagraph, per the currency record).", "refs": [37], "quote": "A manufacturer shall notify any actively exploited vulnerability contained in the product with digital elements that it becomes aware of simultaneously to the CSIRT designated as coordinator, in accordance with paragraph 7 of this Article, and to ENISA."}, {"claim_id": null, "effect": "Open to interpretation", "text": "Whether the hosted platform, or the model call as its remote processing, is a product with digital elements is a reading; P5-saas-only states the fact that nothing is installed, not the reading. GQ-CRA carries it.", "refs": [36], "quote": "‘product with digital elements’ means a software or hardware product and its remote data processing solutions, including software or hardware components being placed on the market separately;"}]}, {"id": "AREA-QUALITY", "status": "applies", "stance": "Allows, with requirements", "name": "Good care with the AI draft", "effect": "Allows, with requirements. Your clinic must use the summary tool so that it reasonably leads to good care. Aweris supplies the review step and the quality evidence you need to judge the tool.", "laws": [{"claim_id": "QL-1", "effect": "Requires", "text": "The clinic as care provider must use its staff and material means, the summary tool among them, in such a way that this reasonably leads to good care; Aweris supplies the quality evidence and the review step the clinic needs to judge the tool.", "refs": [38], "quote": "bedient zich zowel kwalitatief als kwantitatief zodanig van personele en materiële middelen"}]}], "references": [{"n": 1, "article_id": "gdpr#art_28", "law": "Regulation (EU) 2016/679 — General Data Protection Regulation (GDPR)", "provision": "Art. 28", "layer": "EU", "verified": false}, {"n": 2, "article_id": "gdpr#art_32", "law": "Regulation (EU) 2016/679 — General Data Protection Regulation (GDPR)", "provision": "Art. 32", "layer": "EU", "verified": false}, {"n": 3, "article_id": "gdpr#art_30", "law": "Regulation (EU) 2016/679 — General Data Protection Regulation (GDPR)", "provision": "Art. 30", "layer": "EU", "verified": false}, {"n": 4, "article_id": "gdpr#art_33", "law": "Regulation (EU) 2016/679 — General Data Protection Regulation (GDPR)", "provision": "Art. 33", "layer": "EU", "verified": false}, {"n": 5, "article_id": "gdpr#art_44", "law": "Regulation (EU) 2016/679 — General Data Protection Regulation (GDPR)", "provision": "Art. 44", "layer": "EU", "verified": false}, {"n": 6, "article_id": "uavg#art_30", "law": "Uitvoeringswet Algemene verordening gegevensbescherming (UAVG)", "provision": "Art. 30", "layer": "NL", "verified": false}, {"n": 7, "article_id": "wgbo#art_457", "law": "Burgerlijk Wetboek Boek 7, Titel 7, Afdeling 5 — Wet op de geneeskundige behandelingsovereenkomst (Wgbo)", "provision": "Art. 7:457", "layer": "NL", "verified": false}, {"n": 8, "article_id": "gdpr#art_13", "law": "Regulation (EU) 2016/679 — General Data Protection Regulation (GDPR)", "provision": "Art. 13", "layer": "EU", "verified": false}, {"n": 9, "article_id": "gdpr#art_22", "law": "Regulation (EU) 2016/679 — General Data Protection Regulation (GDPR)", "provision": "Art. 22", "layer": "EU", "verified": false}, {"n": 10, "article_id": "gdpr#art_9", "law": "Regulation (EU) 2016/679 — General Data Protection Regulation (GDPR)", "provision": "Art. 9", "layer": "EU", "verified": false}, {"n": 11, "article_id": "gdpr#art_35", "law": "Regulation (EU) 2016/679 — General Data Protection Regulation (GDPR)", "provision": "Art. 35", "layer": "EU", "verified": false}, {"n": 12, "article_id": "wgbo#art_454", "law": "Burgerlijk Wetboek Boek 7, Titel 7, Afdeling 5 — Wet op de geneeskundige behandelingsovereenkomst (Wgbo)", "provision": "Art. 7:454", "layer": "NL", "verified": false}, {"n": 13, "article_id": "begz#art_5", "law": "Besluit elektronische gegevensverwerking door zorgaanbieders", "provision": "Art. 5", "layer": "NL", "verified": false}, {"n": 14, "article_id": "begz#art_3", "law": "Besluit elektronische gegevensverwerking door zorgaanbieders", "provision": "Art. 3", "layer": "NL", "verified": false}, {"n": 15, "article_id": "wgbo#art_455", "law": "Burgerlijk Wetboek Boek 7, Titel 7, Afdeling 5 — Wet op de geneeskundige behandelingsovereenkomst (Wgbo)", "provision": "Art. 7:455", "layer": "NL", "verified": false}, {"n": 16, "article_id": "wgbo#art_456", "law": "Burgerlijk Wetboek Boek 7, Titel 7, Afdeling 5 — Wet op de geneeskundige behandelingsovereenkomst (Wgbo)", "provision": "Art. 7:456", "layer": "NL", "verified": false}, {"n": 17, "article_id": "wabvpz#art_15d", "law": "Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg (Wabvpz)", "provision": "Art. 15d", "layer": "NL", "verified": false}, {"n": 18, "article_id": "wabvpz#art_15e", "law": "Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg (Wabvpz)", "provision": "Art. 15e", "layer": "NL", "verified": false}, {"n": 19, "article_id": "begz#art_1", "law": "Besluit elektronische gegevensverwerking door zorgaanbieders", "provision": "Art. 1", "layer": "NL", "verified": false}, {"n": 20, "article_id": "ai-act#art_50", "law": "Regulation (EU) 2024/1689 — Artificial Intelligence Act", "provision": "Art. 50", "layer": "EU", "verified": false}, {"n": 21, "article_id": "ai-omnibus#art_1", "law": "Regulation (EU) 2026/1744 — Digital Omnibus on AI (amends the AI Act timelines)", "provision": "Art. 1", "layer": "EU", "verified": false}, {"n": 22, "article_id": "ai-act#art_6", "law": "Regulation (EU) 2024/1689 — Artificial Intelligence Act", "provision": "Art. 6", "layer": "EU", "verified": false}, {"n": 23, "article_id": "ai-act#anx_III", "law": "Regulation (EU) 2024/1689 — Artificial Intelligence Act", "provision": "Annex III", "layer": "EU", "verified": false}, {"n": 24, "article_id": "ai-act#art_3", "law": "Regulation (EU) 2024/1689 — Artificial Intelligence Act", "provision": "Art. 3", "layer": "EU", "verified": false}, {"n": 25, "article_id": "ai-act#art_5", "law": "Regulation (EU) 2024/1689 — Artificial Intelligence Act", "provision": "Art. 5", "layer": "EU", "verified": false}, {"n": 26, "article_id": "mdr#art_2", "law": "Regulation (EU) 2017/745 — Medical Device Regulation (consolidated 2025-01-10)", "provision": "Art. 2", "layer": "EU", "verified": false}, {"n": 27, "article_id": "mdr#art_10", "law": "Regulation (EU) 2017/745 — Medical Device Regulation (consolidated 2025-01-10)", "provision": "Art. 10", "layer": "EU", "verified": false}, {"n": 28, "article_id": "cbb#art_10", "law": "Cyberbeveiligingsbesluit", "provision": "Art. 10", "layer": "NL", "verified": false}, {"n": 29, "article_id": "cbw#art_12", "law": "Cyberbeveiligingswet (NIS2-implementatie)", "provision": "Art. 12", "layer": "NL", "verified": false}, {"n": 30, "article_id": "cbw#art_8", "law": "Cyberbeveiligingswet (NIS2-implementatie)", "provision": "Art. 8", "layer": "NL", "verified": false}, {"n": 31, "article_id": "cbw#art_9", "law": "Cyberbeveiligingswet (NIS2-implementatie)", "provision": "Art. 9", "layer": "NL", "verified": false}, {"n": 32, "article_id": "cbr-zorg#art_1.2", "law": "Cyberbeveiligingsregeling voor de zorg", "provision": "Art. 1.2", "layer": "NL", "verified": false}, {"n": 33, "article_id": "nis2#art_2", "law": "Directive (EU) 2022/2555 — NIS2 Directive", "provision": "Art. 2", "layer": "EU", "verified": false}, {"n": 34, "article_id": "src-add-telecomwet#art_11.7a", "law": "Telecommunicatiewet", "provision": "Art. 11.7a", "layer": "NL", "verified": false}, {"n": 35, "article_id": "cra#art_2", "law": "Regulation (EU) 2024/2847 — Cyber Resilience Act", "provision": "Art. 2", "layer": "EU", "verified": false}, {"n": 36, "article_id": "cra#art_3", "law": "Regulation (EU) 2024/2847 — Cyber Resilience Act", "provision": "Art. 3", "layer": "EU", "verified": false}, {"n": 37, "article_id": "cra#art_14", "law": "Regulation (EU) 2024/2847 — Cyber Resilience Act", "provision": "Art. 14", "layer": "EU", "verified": false}, {"n": 38, "article_id": "wkkgz#art_3", "law": "Wet kwaliteit, klachten en geschillen zorg (Wkkgz)", "provision": "Art. 3", "layer": "NL", "verified": false}, {"n": 39, "article_id": "gdpr#art_4", "law": "Regulation (EU) 2016/679 — General Data Protection Regulation (GDPR)", "provision": "Art. 4", "layer": "EU", "verified": false}, {"n": 40, "article_id": "wkkgz#art_1", "law": "Wet kwaliteit, klachten en geschillen zorg (Wkkgz)", "provision": "Art. 1", "layer": "NL", "verified": false}, {"n": 41, "article_id": "wgbo#art_446", "law": "Burgerlijk Wetboek Boek 7, Titel 7, Afdeling 5 — Wet op de geneeskundige behandelingsovereenkomst (Wgbo)", "provision": "Art. 446", "layer": "NL", "verified": false}, {"n": 42, "article_id": "uavg#art_1", "law": "Uitvoeringswet Algemene verordening gegevensbescherming (UAVG)", "provision": "Art. 1", "layer": "NL", "verified": false}], "release": {"state": "BLOCKED", "reviews": [{"id": "BLOCKER-001", "area": "AREA-PROC", "owner_role": "Privacy officer", "needed": ["Signed processor agreement per clinic naming Google Vertex AI as sub-processor for the summary feature.", "Review record of the Google Cloud data processing terms showing the same data protection duties flow down to Google.", "Processor record of processing that lists the summary processing per clinic.", "Description of security measures for the transcript-to-model path, tested before release.", "DPIA support pack given to clinics.", "Incident procedure with the clinic notification step, and the breach notification clause in the processor agreement.", "Configuration record showing the EU data residency and machine-learning processing location settings of the Vertex AI project.", "Exit clause in the processor agreement on deletion or return of data.", "Transfer review record: Google contracting entity, sub-processors and support access for the Vertex AI path, checked by the privacy officer.", "Maximum backup retention for drafts and the restore deletion test, recorded in the security description.", "Audit and information clause, and the notice of infringing instructions, in the processor agreement.", "Data-subject request clause in the processor agreement and a request procedure covering transcripts, drafts and saved summaries, tested before release.", "Clinic instruction on the draft retention period, its stated purpose and the hold procedure, in the processor agreement annex."]}, {"id": "BLOCKER-002", "area": "AREA-HEALTH", "owner_role": "Privacy officer", "needed": ["Clinic decision record on the health data ground and on confidentiality for the summary step, covering the necessity limit of wgbo#art_457 paragraph 2 and information about other persons in transcripts.", "Privacy statement text for clinics that names the AI summary step.", "Confidentiality clauses in the processor agreement and the Google data processing terms.", "Each clinic's DPIA for the AI summary step, carried out before switch-on with Aweris's DPIA support pack, and the clinic's recorded health data ground under Article 9(2)(h) and uavg#art_30."]}, {"id": "BLOCKER-003", "area": "AREA-DOSSIER", "owner_role": "Security officer", "needed": ["Logging design checked against the licensed NEN 7513 text by the security officer.", "Retention and export settings documented in the processor agreement annex.", "Information security description for the client file that clinics can use for their NEN 7510 obligations.", "Procedure for client destruction, access and copy requests on saved summaries, including the free electronic copy and the viewing log on request, agreed with each clinic."]}, {"id": "BLOCKER-004", "area": "AREA-AI", "owner_role": "AI compliance owner", "needed": ["Marking design and test record: the chosen marking method, acceptance criteria for effectiveness, interoperability, robustness and reliability, the feasibility limits found, and test results on drafts.", "AI literacy plan with training records for staff and user material for clinics."]}, {"id": "BLOCKER-005", "area": "AREA-MD", "owner_role": "Regulatory affairs owner", "needed": ["Signed intended-purpose statement for the summary feature.", "Qualification record by the regulatory affairs owner that applies the device definition to that statement, checks whether the feature is itself a device or a safety component of one, and, if so, records its MDR class and whether a third-party conformity assessment is required (AI Act Article 6(1)). If the feature is a device, the record also states who is its manufacturer under MDR Article 2(30) (who builds it or has it built, and under whose name or trade mark it is marketed)."]}, {"id": "BLOCKER-006", "area": "AREA-CYBER", "owner_role": "Security officer", "needed": ["Size and designation status of each clinic recorded at onboarding.", "Security description and evidence for clinic supplier checks.", "Record of Aweris's own Cbw status: size (P7-size), no designation under article 9 and no public electronic communications or trust service, re-checked yearly and when Aweris passes the micro-enterprise thresholds."]}, {"id": "BLOCKER-007", "area": "AREA-DEVICE", "owner_role": "Privacy officer", "needed": ["List of what the summary screens store on or read from the device, checked before release."]}, {"id": "BLOCKER-008", "area": "AREA-CRA", "owner_role": "Regulatory affairs owner", "needed": ["Counsel note on whether the hosted platform, or the model call as its remote processing, falls under the CRA.", "If in scope: the vulnerability and severe incident reporting procedure."]}, {"id": "BLOCKER-009", "area": "AREA-QUALITY", "owner_role": "Product owner", "needed": ["Draft quality evaluation record, shared with clinics before they switch the feature on."]}]}, "definitions": [{"term": "AI system", "refs": [24]}, {"term": "controller", "refs": [39]}, {"term": "data concerning health", "refs": [39]}, {"term": "deployer", "refs": [24]}, {"term": "dossier", "refs": [40]}, {"term": "general-purpose AI model", "refs": [24]}, {"term": "intended purpose", "refs": [26]}, {"term": "medical device", "refs": [26]}, {"term": "patient", "refs": [41]}, {"term": "personal data", "refs": [39]}, {"term": "processing", "refs": [39]}, {"term": "processor", "refs": [39]}, {"term": "provider", "refs": [24]}, {"term": "special categories of personal data", "refs": [42]}, {"term": "zorgaanbieder", "refs": [40]}], "set_aside": [{"title": "A 'product' for liability", "kind": "CARD", "reason": "The PLD sets liability for defective products placed on the market after 2026-12-08 (Article 2(1) as corrected, per source_currency.json); it sets no design duty or prohibition that changes a zone here. The mandatory approval alone is not shown to catch omissions or invented content: the risk of a wrong draft is handled by the draft quality evaluation with acceptance criteria (CORE-SUMMARY-DRAFT) and the review procedure (REVIEW-APPROVE), and the liability allocation by the customer-contract review listed under documents."}, {"title": "EHDS — EHR systems are regulated", "kind": "CARD", "reason": "EHR system duties apply from 2029-03-26 at the earliest (Article 105, third paragraph, per source_currency.json), and the clinic EPD is the official record (P10-record-system); whether the platform as a whole is an EHR system is a platform question, not a step this feature adds."}, {"title": "Residency & logging-exemption check", "kind": "CARD", "reason": "The residency and prompt logging settings are the AREA-PROC configuration control with its configuration record; whether any recipient outside the EU remains is a Chapter V point carried by PR-10 (gdpr#art_44) and gray question GQ-TRANSFER, not by the settings."}, {"title": "Secrets and key rotation", "kind": "CARD", "reason": "Credential protection for the model calls is part of the security measures under gdpr#art_32 in AREA-PROC (claim PR-5 and its security description); NEN 7510 is pointer-only and counts only through begz#art_3, cited in AREA-DOSSIER."}, {"title": "Structured entry constrains the forms", "kind": "CARD", "reason": "EHR system duties apply from 2029-03-26 at the earliest (Article 105, third paragraph, per source_currency.json), and the clinic EPD is the official record (P10-record-system); whether the platform as a whole is an EHR system is a platform question, not a step this feature adds."}, {"title": "Akwa GGZ — Generieke module eHealth", "kind": "LAW", "reason": "Quality guidance on eHealth in care delivery; video sessions and their recording are excluded scope (existing feature), and it sets no duty on drafting a summary."}, {"title": "CJEU C-307/22 — first copy of medical records", "kind": "LAW", "reason": "Pointer only, no text in the vault; the right to a copy of the record is exercised against the clinic as controller (P1-data-role), and the saved summary is part of the clinic dossier cited from wgbo#art_454."}, {"title": "CJEU C-579/21 — access to consultation dates and purposes", "kind": "LAW", "reason": "Pointer only, no text in the vault; access requests go to the clinic as controller (P1-data-role), and the access logging the clinic needs is the begz#art_5 control in AREA-DOSSIER."}, {"title": "Convention 108+ — Convention for the Protection of Individuals with regard to the Processing of Personal Data (modernised)", "kind": "LAW", "reason": "Treaty background to the GDPR; the GDPR and UAVG articles that apply are cited directly in AREA-PROC and AREA-HEALTH."}, {"title": "Data Act", "kind": "LAW", "reason": "The feature adds no data sharing, switching between cloud services or product data access; it sends one transcript to one model provider and stores the summary for the clinic."}, {"title": "Data Governance Act", "kind": "LAW", "reason": "The feature makes no secondary use or re-use of health data and no data intermediation; Aweris uses client data for no purpose of its own (P1-data-role)."}, {"title": "EDPB 01/2022 — right of access", "kind": "LAW", "reason": "Guidance without article text on access requests, which are exercised against the clinic as controller; the processor's duty to assist with rights requests for transcripts, drafts and summaries is cited from gdpr#art_28 in AREA-PROC (claim PR-12), and the clinic's access and copy duties for the dossier from wgbo#art_456 and wabvpz#art_15d in AREA-DOSSIER (claims DS-6 and DS-7)."}, {"title": "EDPB 07/2020 — controller and processor roles", "kind": "LAW", "reason": "Guidance only; the roles are settled by P1-data-role (Aweris processor for the clinics) and the processor duties are cited from gdpr#art_28 in AREA-PROC."}, {"title": "EDPB/WP29 DPIA Guidelines (wp248rev01)", "kind": "LAW", "reason": "WP29 guidance only; the DPIA is the clinic's duty and Aweris's support for it is cited from gdpr#art_28 (claim PR-7, DPIA support pack)."}, {"title": "EHDS — European Health Data Space", "kind": "LAW", "reason": "EHR system duties apply from 2029-03-26 at the earliest (Article 105, third paragraph, per source_currency.json), and the clinic EPD is the official record (P10-record-system); whether the platform as a whole is an EHR system is a platform question, not a step this feature adds."}, {"title": "IGJ — Toetsingskader Digitale Zorg", "kind": "LAW", "reason": "Supervisory framework, summary only and without article text, which decides no zone. The statute duties it checks at the clinic for this feature are cited directly: wkkgz#art_3 in AREA-QUALITY, wgbo and uavg in AREA-HEALTH and AREA-DOSSIER, and begz in AREA-DOSSIER."}, {"title": "KNMG richtlijn omgaan met medische gegevens", "kind": "LAW", "reason": "KNMG guidance for physicians on medical records, guidance only; the dossier and confidentiality duties it explains are cited from wgbo#art_454 and wgbo#art_457 in AREA-DOSSIER and AREA-HEALTH."}, {"title": "Landelijk Kwaliteitsstatuut GGZ 4.0", "kind": "LAW", "reason": "Clinic quality-statement standard without article text, which decides no zone. It asks the clinic to describe how it watches the legal dossier duty and how its dossier system is set up; those statute duties are cited directly (wgbo#art_454 in AREA-DOSSIER, wgbo#art_457 in AREA-HEALTH, wkkgz#art_3 in AREA-QUALITY), and the standard sets no rule for the product beyond them."}, {"title": "MDCG 2019-11 Rev.1 — software qualification & classification", "kind": "LAW", "reason": "MDCG guidance on qualification, guidance only; the qualification question is carried by gray question GQ-MDR on mdr#art_2 in AREA-MD."}, {"title": "NEN 7510 — health information security (ISMS)", "kind": "LAW", "reason": "Pointer-only norm; it counts only through begz#art_3, cited in AREA-DOSSIER (claim DS-4), and the security of processing is cited from gdpr#art_32."}, {"title": "NEN 7512 — trusted data exchange", "kind": "LAW", "reason": "Pointer-only norm; it counts only through begz#art_3, cited in AREA-DOSSIER (claim DS-4); the call to the model provider is processing by a sub-processor, not an exchange between care parties."}, {"title": "NEN 7513 — access logging", "kind": "LAW", "reason": "Pointer-only norm; it counts only through begz#art_5, cited in AREA-DOSSIER (claim DS-3), with logging of reads and writes as the control."}, {"title": "NEN 7521 – Toegang tot patiëntgegevens – Grondslagen voor uitwisseling", "kind": "LAW", "reason": "Pointer-only norm whose binding force is not shown in the vault; access to transcripts and drafts is limited to the treating psychologist and roles the clinic sets under the gdpr#art_32 control in AREA-PROC."}, {"title": "NEN 8028 — telemedicine quality", "kind": "LAW", "reason": "Telemedicine quality norm for the video care itself; recording and transcription of sessions are excluded scope, and the norm sets nothing on drafting a summary."}, {"title": "NIP / LVVP beroepscodes", "kind": "LAW", "reason": "Professional code of psychologists, guidance only and part of the clinic's professional standard; the psychologist's own review and approval of every draft (REVIEW-APPROVE) is how the feature meets it, and the dossier duties are cited from wgbo#art_454."}, {"title": "Product Liability Directive", "kind": "LAW", "reason": "The PLD sets liability for defective products placed on the market after 2026-12-08 (Article 2(1) as corrected, per source_currency.json); it sets no design duty or prohibition that changes a zone here. The mandatory approval alone is not shown to catch omissions or invented content: the risk of a wrong draft is handled by the draft quality evaluation with acceptance criteria (CORE-SUMMARY-DRAFT) and the review procedure (REVIEW-APPROVE), and the liability allocation by the customer-contract review listed under documents."}, {"title": "Schrems II — CJEU C-311/18", "kind": "LAW", "reason": "Court judgment without article text, which decides no zone. The transfer point it raises is a Chapter V point, cited from gdpr#art_44 in AREA-PROC (claim PR-10); whether the Vertex AI path involves a transfer is not settled by EU residency settings and is carried by gray question GQ-TRANSFER."}, {"title": "Telecommunicatiewet (11.7 / 11.7a)", "kind": "LAW", "reason": "AREA-DEVICE cites the full text src-add-telecomwet (article 11.7a); telecomwet is the partial copy of chapters 11 and 11a with the same article ids, which cannot decide a zone."}, {"title": "Wet BIG — beroepen in de individuele gezondheidszorg", "kind": "LAW", "reason": "The feature performs no reserved act and touches no BIG registration; the psychologists are BIG-registered (P3-clinics) and approve every summary themselves."}, {"title": "Wetboek van Strafvordering", "kind": "LAW", "reason": "No criminal procedure step is part of the feature; seizure or the right to refuse concerns the clinic's dossier in general, not the summary step."}, {"title": "Wet medische hulpmiddelen", "kind": "LAW", "reason": "The Wmh applies only to devices the MDR covers (wmh#art_2); whether the feature is one is carried by gray question GQ-MDR on mdr#art_2 in AREA-MD."}, {"title": "Wetboek van Strafrecht art. 272 — schending beroepsgeheim", "kind": "LAW", "reason": "The vault copy of the Penal Code is partial and cannot decide a zone; the secrecy point it raises for sending transcripts is carried by gray question GQ-CONF on wgbo#art_457 in AREA-HEALTH."}], "sweep": {"checked": 443, "relevant": 160}, "questions": [{"id": "GQ-MDR", "either": false, "kind": "Fact to supply", "assumable": true, "assumed_index": 0, "other_zone": "GRAY", "owner_role": "Regulatory affairs owner", "assumed_conditions": ["Signed intended-purpose statement", "Claim review of UI and sales text", "Prompt blocks diagnoses, scores, risk ratings and treatment advice"], "confirmation": {"kind": "confirmed", "on": "2026-10-05", "by": "Aweris owner (in chat with the Auditor builder)", "matches": true, "scenario_index": 0}, "assumed": "Aweris states in a signed statement that the feature only drafts documentation for the psychologist, and says nothing else in its material.", "side": "aweris", "title": "What purpose will Aweris state for the summary feature?", "plain": "Aweris decides what its instructions, screens and sales text say: drafting documentation only, or a medical purpose such as diagnosis or treatment support.", "good": "The feature stays buildable as a documentation tool, with the signed statement and a claim review of screens and sales text.", "bad": "A medical purpose stated or marketed leaves the parts open to the medical device rules and a longer route."}, {"id": "GQ-CONF", "either": true, "kind": "Legal reading", "assumable": true, "assumed_index": 0, "other_zone": "GREEN", "owner_role": "Privacy officer", "assumed_conditions": ["Processor agreements with confidentiality clauses", "Clients informed of the summary step"], "confirmation": {"kind": "expected_clinic", "on": "2026-10-05", "by": "Aweris owner (in chat with the Auditor builder)", "matches": true, "scenario_index": 0}, "assumed": "Your counsel reads processing by Aweris and Google under processor agreements as part of your own processing.", "side": "clinic", "title": "Do clients need to give consent for the summary step?", "plain": "Your clinic's counsel reads whether sending the transcript to Aweris and Google is giving client information to others, or part of your own processing under processor agreements.", "good": "Either answer works. If it is part of your own processing, no separate client consent is needed.", "bad": "If it counts as giving information to others, your clinic also needs client consent and a decision record."}, {"id": "GQ-GOOGLE", "either": false, "kind": "Legal reading", "assumable": true, "assumed_index": 0, "other_zone": "GRAY", "owner_role": "Product owner", "assumed_conditions": ["Written confirmation or counsel note on file", "Vendor terms review record"], "confirmation": {"kind": "confirmed", "on": "2026-10-05", "by": "Aweris owner (in chat with the Auditor builder)", "matches": true, "scenario_index": 0}, "assumed": "Google confirms in writing, or counsel concludes, that drafting documentation summaries is outside the clause.", "side": "aweris", "title": "Does Google's healthcare restriction cover this feature?", "plain": "Aweris asks Google, or a counsel, whether Google's clause on healthcare use for generative AI covers drafting therapy session summaries.", "good": "The feature stays buildable with Google as provider, with the written position on file.", "bad": "If the clause covers the use, the feature cannot go ahead with Google. Another model provider is a redesign that needs a new brief."}, {"id": "GQ-GROUND", "either": false, "kind": "Legal reading", "assumable": true, "assumed_index": 0, "other_zone": "GRAY", "owner_role": "Privacy officer", "assumed_conditions": ["Clinic decision record on the health data ground", "Secrecy undertakings for Aweris staff and the model provider", "Clinic DPIA for the summary step completed before switch-on, supported by Aweris's DPIA support pack"], "confirmation": {"kind": "expected_clinic", "on": "2026-10-05", "by": "Aweris owner (in chat with the Auditor builder)", "matches": true, "scenario_index": 0}, "assumed": "Your clinic decides and records that the summary step is needed for care or practice management, completes its DPIA, and only people bound to secrecy handle transcripts.", "side": "clinic",       <p class="plain">${esc(q.plain)}</p>
      <div class="assume${confirmed && c.kind === "confirmed" ? " ok" : ""}"><b>${label}</b><span>${other ? esc(q.bad) : esc(q.assumed)}</span>
        ${!other && q.assumed_conditions && q.assumed_conditions.length ? `<span style="margin-top:4px">${confirmed && c.kind === "confirmed" ? "Evidence still to record:" : "For this to hold:"}</span><ul class="cond-list">${q.assumed_conditions.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>
      ${other ? `<p class="holds">The Auditor checked only its own assumption. Run the audit again with this answer to settle the affected parts.</p>`
              : `<div class="outcome"><span class="dot good"></span><span>${esc(q.good)}</span></div><p class="holds">If the answer is different: ${esc(q.bad)}</p>`}
      <div class="pick"><div class="seg" role="group" aria-label="Answer for ${esc(q.title)}">
        <button type="button" class="pick-btn" id="p-${esc(q.id)}-a" data-q="${esc(q.id)}" data-v="assumed" aria-pressed="${!other}">Our assumption</button>
        <button type="button" class="pick-btn" id="p-${esc(q.id)}-o" data-q="${esc(q.id)}" data-v="other" aria-pressed="${other}">Other answer</button></div>
        <span class="holds">Affects: ${affects(a, q)}${q.owner_role ? ` · Confirmed by: ${esc(q.owner_role)}` : ""}</span></div>
    </div></li>`;
}
function inputItem(a, q){
  return `<li class="point" id="d-${esc(q.id)}"><div class="item">
      <div class="item-head"><span class="t">${esc(q.title)}</span><span class="chips">${sideChip(q.side)}<span class="chip kind">${esc(q.kind)}</span></span></div>
      <p class="plain">${esc(q.plain)}</p>
      <div class="outcome"><span class="dot good"></span><span>${esc(q.good)}</span></div>
      <div class="outcome"><span class="dot ${q.either ? "note" : "bad"}"></span><span>${esc(q.bad)}</span></div>
      <span class="holds">${q.assumable ? "The Auditor made no assumption for this point." : "This cannot be assumed: it needs a verified source or a finished check."} Affects: ${affects(a, q)}</span>
    </div></li>`;
}
function decisions(a){
  const assumed = a.questions.filter(isAssumed), input = a.questions.filter(q => !isAssumed(q));
  const nConf = assumed.filter(q => q.confirmation && q.confirmation.matches && q.confirmation.kind === "confirmed").length;
  const nClinic = assumed.filter(q => q.confirmation && q.confirmation.matches && q.confirmation.kind === "expected_clinic").length;
  return `<div class="sec-head"><span class="sn">4</span><h2>Assumptions</h2><p class="num">${assumed.length
      ? (nConf || nClinic
        ? `The report rests on ${plural(assumed.length, "answer", "answers")}: ${nConf} confirmed by Aweris, ${nClinic} expected from each clinic${assumed.length - nConf - nClinic ? `, ${assumed.length - nConf - nClinic} still assumed by the Auditor` : ""}. A confirmed answer still needs its evidence recorded; switch any answer to see what changes.`
        : `Instead of waiting for answers, the Auditor assumed ${plural(assumed.length, "answer", "answers")}. The whole report rests on them. They are assumptions, not facts: switch any of them to see what changes.`)
      : "The Auditor made no assumptions for this feature."}${input.length ? ` ${plural(input.length, "point needs", "points need")} your input.` : ""}</p></div>
    ${assumed.length ? `<ul class="points">${assumed.map(q => assumptionItem(a, q)).join("")}</ul>` : ""}
    ${input.length ? `<h3 class="subhead">Needs your input</h3><ul class="points">${input.map(q => inputItem(a, q)).join("")}</ul>` : ""}
    ${!a.questions.length ? `<div class="empty">Nothing to assume or decide for this feature.</div>` : ""}`;
}

/* 5 documents */
function documents(a){
  const groups = [];
  a.documents.forEach(d => { let g = groups.find(x => x.when === d.when); if (!g) groups.push(g = { when:d.when, docs:[] }); g.docs.push(d); });
  return `<section class="section" id="documents">
    <div class="sec-head"><span class="sn">5</span><h2>Documents and reviews</h2><p class="num">${plural(a.documents.length, "document", "documents")} to prepare, grouped by when they are needed, and the reviews that clear the feature for release.</p></div>
    ${groups.length ? `<div class="dgroups">${groups.map(g => `<div class="dgroup"><h3>${esc(g.when)} <span class="num">${g.docs.length}</span></h3>
      <ul class="docs">${g.docs.map(d => `<li class="doc"><span>${esc(d.name)}${refs(d.refs || [])}</span>${sideChip(d.side)}<span class="meta">${d.owner_role ? `Owner: ${esc(d.owner_role)}` : ""}${(d.parts || []).length ? ` · For: ${d.parts.map(id => esc(a.components.find(c => c.id === id)?.name || id)).join(", ")}` : ""}</span></li>`).join("")}</ul></div>`).join("")}</div>` : `<div class="empty">No documents listed.</div>`}
    ${a.release && a.release.reviews && a.release.reviews.length ? `<h3 class="subhead">Reviews before release</h3><p class="holds" style="margin-bottom:10px">Each review is recorded by its owner before the feature handles real client data.</p>
      <div class="docs" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))">${a.release.reviews.map(r => `<div class="review"><b>${esc(a.areas.find(x => x.id === r.area)?.name || r.id)}</b><span class="holds">Owner: ${esc(r.owner_role)}</span>
        ${r.needed.length ? `<ul>${r.needed.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>`).join("")}</div>` : ""}
  </section>`;
}

/* 6 references */
function references(a){
  const laws = [];
  a.references.forEach(r => { let g = laws.find(x => x.law === r.law); if (!g) laws.push(g = { law:r.law, layer:r.layer, refs:[] }); g.refs.push(r); });
  const anyUnverified = a.references.some(r => !r.verified);
  return `<section class="section" id="references">
    <div class="sec-head"><span class="sn">6</span><h2>References</h2><p class="num">${plural(a.references.length, "article", "articles")} from ${plural(laws.length, "law", "laws and regulations")} were cited in this report.</p></div>
    <div class="refs">${laws.map(g => `<div class="rlaw"><h3>${esc(g.law)} <span>${g.layer === "NL" ? "Dutch law" : g.layer === "EU" ? "EU law" : esc(g.layer || "")}</span></h3>
      <ol>${g.refs.map(r => `<li id="ref-${r.n}"><b class="num">[${r.n}]</b>${esc(r.provision || r.article_id)}</li>`).join("")}</ol></div>`).join("")}</div>
    ${(a.definitions || []).length ? `<h3 class="subhead">Definitions relied on</h3><p class="holds">${a.definitions.map(d => `${esc(d.term)}${refs(d.refs)}`).join(" · ")}</p>` : ""}
    ${(a.set_aside || []).length ? `<h3 class="subhead">Checked and set aside</h3><p class="holds num">${a.sweep && a.sweep.checked ? `All ${a.sweep.checked} laws and rules in the library were checked against this feature. ` : ""}These looked relevant but were set aside, with the reason the audit gives.</p>
      <details class="more" style="margin-top:8px"><summary>${CHEV}Show ${plural(a.set_aside.length, "item", "items")}</summary><ul class="setaside">${a.set_aside.map(x => `<li>${esc(x.title)}<span>${esc(x.reason)}</span></li>`).join("")}</ul></details>` : ""}
    ${anyUnverified ? `<p class="refnote">The article texts come from the Aweris law library. They have not yet been checked against the official publication by a lawyer.</p>` : ""}
  </section>`;
}

function render(){
  const a = AUDIT;
  state.mode = "assumed";
  document.getElementById("app").innerHTML = `<section id="overview"></section><section class="section" id="zones"></section><section class="section" id="details"></section><section class="section" id="decisions"></section>` +
    documents(a) + references(a) +
    `<footer class="trust num"><span>${plural(a.checks.areas_checked, "area of law", "areas of law")} checked</span><span>${esc(a.checks.evaluator)}</span><span>${esc(a.checks.sources)}</span><span>Assumptions are the Auditor's, not facts.</span><span>This is not legal advice.</span></footer>`;
  document.getElementById("bar-feat").textContent = a.feature.name;
  document.title = a.feature.name + " · Aweris";
  refresh();
}
function refresh(focusId){
  const a = AUDIT;
  document.getElementById("overview").innerHTML = overview(a);
  document.getElementById("zones").innerHTML = zones(a);
  document.getElementById("details").innerHTML = details(a);
  document.getElementById("decisions").innerHTML = decisions(a);
  document.querySelectorAll(".pick-btn").forEach(b => b.onclick = () => { state.sel[b.dataset.q] = b.dataset.v; if (b.dataset.v === "other") state.mode = "assumed"; refresh(b.id); });
  document.querySelectorAll("details.area").forEach(d => d.addEventListener("toggle", () => d.open ? state.openAreas.add(d.dataset.key) : state.openAreas.delete(d.dataset.key)));
  if (focusId) document.getElementById(focusId)?.focus({ preventScroll:true });
  if (typeof onScroll === "function") onScroll();
}

/* section nav */
const nav = document.getElementById("nav"), ind = document.getElementById("ind"), links = [...nav.querySelectorAll("a")];
const place = l => { ind.style.transform = `translateX(${l.offsetLeft - 3}px) scaleX(${l.offsetWidth / 100})`; };
function setActive(id){ links.forEach(l => { const on = l.getAttribute("href") === "#" + id; l.setAttribute("aria-current", on); if (on) place(l); }); }

render();
const bar = document.getElementById("bar");
const onScroll = () => {
  bar.classList.toggle("scrolled", window.scrollY > 120);
  const ids = ["overview","zones","details","decisions","documents","references"];
  let cur = ids[0];
  for (const id of ids) { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < window.innerHeight * 0.35) cur = id; }
  if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 4) cur = ids[ids.length - 1];
  setActive(cur);
};
window.addEventListener("scroll", onScroll, { passive:true });
window.addEventListener("resize", () => { const c = links.find(l => l.getAttribute("aria-current") === "true"); if (c) place(c); });
requestAnimationFrame(onScroll);
</script>
