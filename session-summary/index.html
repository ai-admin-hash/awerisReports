/* Layout: a short paper. 1 Overview (how much is buildable + verdict), 2 Zones at a glance, 3 Details per zone
   (why each part sits where it does, and which laws allow, require, restrict or leave it open), 4 Decisions,
   5 Documents, 6 References. Sticky frosted bar with section nav. Filled by presentation/build.py render. */
:root{
  --orange:#E94E1A; --orange-soft:#FDE9E1; --yellow:#E9E11E; --yellow-soft:#FBF8C8;
  --ink:#3B4058; --ink-2:#646A82; --ink-3:#9397A8;
  --bg:#FFFFFF; --wash:#FAF8F3; --line:#ECE8E1; --line-2:#DCD6CC;
  --z-green:#23784A; --z-green-bg:#E4F2E8; --z-gray:#545E7C; --z-gray-bg:#ECEEF4; --z-red:#B0142F; --z-red-bg:#F8E1E5;
  --display:"Ethdown","Italiana","Didot",Georgia,serif;
  --body:"Jost","Avenir Next","Futura",system-ui,sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,.part-head h4,.law span,.why span,.what,.doc span{overflow-wrap:anywhere}
h1,h2,h3,h4,p{margin:0}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance}
button{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid transparent;transition:border-color 200ms ease}
.bar.scrolled{border-bottom-color:var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px 16px;min-height:60px;padding-block:8px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 200px}
.mark svg{width:28px;height:28px;flex:none}
.mark .word{font-family:var(--display);font-size:24px;color:var(--orange);letter-spacing:.03em;line-height:1}
.mark .feat{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
.bar.scrolled .feat{opacity:1;transform:none}
.nav{position:relative;display:flex;gap:2px;padding:3px;background:var(--wash);border:1px solid var(--line);border-radius:999px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{position:relative;z-index:1;padding:6px 12px;border-radius:999px;font-size:13.5px;color:var(--ink-2);text-decoration:none;white-space:nowrap;transition:color 160ms ease}
.nav a b{font-weight:500;color:var(--ink-3);margin-right:5px}
.nav a[aria-current="true"]{color:var(--ink);font-weight:500}
.nav .ind{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:100px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(59,64,88,.12),0 0 0 1px var(--line);transform-origin:left center;transition:transform 240ms var(--ease-in-out)}

/* shared */
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:500}
.section{padding-block:56px 8px}
.sec-head{display:grid;gap:6px;margin-bottom:20px;max-width:72ch}
.sec-head .sn{font-family:var(--display);font-size:20px;color:var(--orange)}
.sec-head h2{font-size:clamp(30px,3.6vw,42px);line-height:1.06;letter-spacing:-.008em}
.sec-head p{color:var(--ink-2)}
.zone{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;letter-spacing:.02em;padding:4px 11px 4px 8px;border-radius:999px;white-space:nowrap}
.zone svg{width:13px;height:13px;flex:none}
.z-GREEN{color:var(--z-green);background:var(--z-green-bg)} .z-GRAY{color:var(--z-gray);background:var(--z-gray-bg)} .z-RED{color:var(--z-red);background:var(--z-red-bg)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.side-clinic{background:var(--orange-soft);color:#B53A10} .side-aweris{background:#EEF0F5;color:var(--ink)} .side-both{background:var(--wash);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.either{background:var(--yellow-soft);color:#6B6608} .decides{background:#fff;color:var(--orange);box-shadow:inset 0 0 0 1.5px var(--orange)}
.kind{background:var(--wash);color:var(--ink-2)}
.eff-Requires{background:#EEF0F5;color:var(--ink)} .eff-Allows{background:var(--z-green-bg);color:var(--z-green)}
.eff-Restricts{background:var(--z-red-bg);color:var(--z-red)} .eff-Open{background:var(--yellow-soft);color:#6B6608} .eff-Sets{background:var(--wash);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.st-Allows{color:var(--z-green)} .st-Open{color:#8A8410} .st-Restricts{color:var(--z-red)}
.press{transition:transform 140ms var(--ease-out)} .press:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
sup.ref a{font-size:11px;font-weight:500;color:var(--orange);text-decoration:none;padding:0 1px}
sup.ref a:hover{text-decoration:underline}

/* 1 overview */
.hero{padding-block:40px 0}
.hero h1{font-size:clamp(42px,6.6vw,80px);line-height:1;letter-spacing:-.015em;margin-top:12px}
.hero .ask{margin-top:16px;font-size:17px;color:var(--ink-2);max-width:60ch}
.score{margin-top:32px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:24px 40px;align-items:center;padding:26px;border:1px solid var(--line);border-radius:var(--r)}
.score .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big b{font-family:var(--display);font-weight:400;font-size:clamp(64px,9vw,104px);line-height:.9;color:var(--ink)}
.score .big span{font-family:var(--display);font-size:clamp(28px,3.4vw,38px);color:var(--ink-3)}
.score .cap{margin-top:8px;color:var(--ink-2);max-width:36ch}
.stack{display:flex;height:22px;border-radius:999px;overflow:hidden;background:var(--line);gap:2px}
.stack span{display:block;height:100%;min-width:6px}
.stack .s-GREEN{background:var(--z-green)} .stack .s-COND{background:repeating-linear-gradient(135deg,var(--z-green) 0 6px,#7DBB94 6px 12px)}
.stack .s-GRAY{background:#8C93AC} .stack .s-RED{background:var(--z-red)}
.stack-legend{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;font-size:13.5px;color:var(--ink-2)}
.stack-legend div{display:flex;gap:8px;align-items:baseline}
.stack-legend i{flex:none;display:inline-block;width:10px;height:10px;border-radius:3px;transform:translateY(1px)}
.stack-legend b{color:var(--ink);font-weight:600}
.core{margin-top:12px;font-size:13.5px;color:var(--ink-2)}
.verdict{margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 20px;align-items:start;padding:22px 24px;border-radius:var(--r);background:var(--wash);border:1px solid var(--line)}
.verdict h3{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.8vw,32px);line-height:1.12}
.verdict p{margin-top:6px;color:var(--ink-2);max-width:72ch}

/* 2 zones */
.zcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.zcol{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;align-content:start;border-top:4px solid var(--zc)}
.zcol.GREEN{--zc:var(--z-green)} .zcol.GRAY{--zc:#8C93AC} .zcol.RED{--zc:var(--z-red)}
.zcol h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:17px;font-weight:500}
.zcol h3 b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.zcol .mean{font-size:13.5px;color:var(--ink-2)}
.zcol ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.zcol li a{display:block;padding:9px 12px;border-radius:10px;background:var(--wash);text-decoration:none;font-size:14px;font-weight:500;transition:background-color 160ms ease}
@media (hover:hover) and (pointer:fine){.zcol li a:hover{background:var(--line)}}
.zcol .none{font-size:13.5px;color:var(--ink-3)}
.matrix-wrap{margin-top:22px}
.matrix-wrap h3{font-size:15px;font-weight:500;margin-bottom:10px}
.grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.rules{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.rules th,.rules td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.rules tr:last-child td{border-bottom:0}
.rules thead th{font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--wash)}
.rules thead th.pc{text-align:center;text-transform:none;letter-spacing:0;font-size:12.5px}
.rules td.c{text-align:center}
.mk{display:inline-block;width:13px;height:13px;border-radius:50%}
.mk.applies{background:var(--orange)} .mk.may{box-shadow:inset 0 0 0 2px var(--orange)}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin-top:10px}

/* 3 details */
.zsub{margin-top:30px}
.zsub>h3{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:500;margin-bottom:6px}
.zsub>p{color:var(--ink-2);margin-bottom:14px;max-width:72ch}
.part{border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:16px;scroll-margin-top:90px}
.part+.part{margin-top:12px}
.part-head{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}
.part-head h4{font-size:19px;font-weight:500;line-height:1.3}
.part-head .role{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.part .what{color:var(--ink-2);max-width:75ch}
.why{padding:14px 16px;border-radius:12px;background:var(--wash);display:grid;gap:4px;max-width:85ch}
.why b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.waits{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.waits a{font-size:13px;text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);transition:border-color 160ms ease,background-color 160ms ease}
@media (hover:hover) and (pointer:fine){.waits a:hover{border-color:var(--orange);background:var(--orange-soft)}}
.areas{display:grid;gap:8px}
details.area{border:1px solid var(--line);border-radius:12px}
details.area>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center}
details.area>summary::-webkit-details-marker{display:none}
.area .an{font-weight:500;font-size:14.5px}
.area .ae{grid-column:1/-1;font-size:13.5px;color:var(--ink-2)}
.area .st{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap}
.chev{width:16px;height:16px;color:var(--ink-3);transition:transform 200ms var(--ease-out)}
details[open]>summary .chev{transform:rotate(180deg)}
@media (hover:hover) and (pointer:fine){details.area>summary:hover{background:var(--wash);border-radius:12px}}
.laws{list-style:none;margin:0;padding:0 14px 14px;display:grid;gap:10px}
.law{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;font-size:14px;padding-top:10px;border-top:1px solid var(--line)}
.law .chip{margin-top:1px}
.law q{grid-column:2;display:block;font-size:13px;color:var(--ink-2);font-style:italic;quotes:"\201C" "\201D"}

/* 4 decisions */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--wash);border:1px solid var(--line);border-radius:999px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:background-color 160ms ease,color 160ms ease,transform 140ms var(--ease-out)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(59,64,88,.12),0 0 0 1px var(--line)}
.points{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.point{scroll-margin-top:90px}
.point+.point{border-top:1px solid var(--line)}
.point>button{width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.point .t{font-size:15.5px;font-weight:500;line-height:1.35}
.point .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.point[data-open="true"] .chev{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows 240ms var(--ease-out)}
.point[data-open="true"] .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.body .inner{padding:0 18px 18px;display:grid;gap:12px;max-width:82ch}
.body .plain{color:var(--ink-2)}
.outcome{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.outcome .dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.dot.good{background:var(--z-green)} .dot.bad{background:var(--orange)} .dot.note{background:var(--yellow)}
.holds{font-size:12.5px;color:var(--ink-3)}
@media (hover:hover) and (pointer:fine){.point>button:hover{background:var(--wash)}}
.empty{padding:26px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:var(--r)}

.mode{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:22px}
.view-note{font-size:13px;color:var(--ink-2)}
.assume{display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--yellow-soft)}
.assume.ok{background:var(--z-green-bg)}
.assume.ok>b{color:var(--z-green)}
.assume>b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6608;font-weight:500}
.cond-list{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.zone.recheck{background:#fff;color:var(--z-gray);box-shadow:inset 0 0 0 1.5px #8C93AC}
.subhead{font-size:15px;font-weight:500;margin:22px 0 10px}
.pick{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.item{padding:16px 18px;display:grid;gap:10px}
.item-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center}
.item-head .chips{display:flex;flex-wrap:wrap;gap:6px}
.banner{margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px 18px;border-radius:var(--r);border:1.5px solid var(--orange);background:#fff}
.banner b{color:var(--orange)}
.cover{margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.must{display:grid;gap:6px}
.must ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
details.more>summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary .chev{transform:rotate(180deg)}
details.more .inner2{margin-top:8px;display:grid;gap:10px}
details.more h5{margin:0;font-size:13px;font-weight:500;color:var(--ink-2)}
.fallback{font-size:14px;color:var(--ink-2);border-left:3px solid var(--line-2);padding-left:12px}
.off{font-size:12px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.doc .meta{grid-column:1/-1;font-size:12.5px;color:var(--ink-2)}
.review{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.review ul{margin:0;padding-left:18px;display:grid;gap:3px;color:var(--ink-2)}
.setaside{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.setaside li{font-size:13.5px;border-top:1px solid var(--line);padding-top:8px}
.setaside li span{display:block;color:var(--ink-2);font-size:13px}
/* 5 documents, styles */
.dgroups{display:grid;gap:22px}
.dgroup h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:500;display:flex;gap:10px;margin-bottom:10px}
.dgroup h3 span{color:var(--ink-3)}
.docs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;font-size:14px}

/* 6 references */
.refs{display:grid;gap:22px}
.rlaw h3{font-size:15.5px;font-weight:500;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rlaw h3 span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.rlaw ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.rlaw li{font-size:13.5px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;scroll-margin-top:100px;transition:background-color 300ms ease,border-color 300ms ease}
.rlaw li b{color:var(--orange);font-weight:500;margin-right:6px}
.rlaw li:target{background:var(--orange-soft);border-color:var(--orange)}
.refnote{margin-top:14px;font-size:13px;color:var(--ink-2);max-width:75ch}

.trust{margin-block:52px 40px;padding-top:18px;border-top:2px solid var(--orange);display:flex;flex-wrap:wrap;gap:8px 28px;font-size:13px;color:var(--ink-2)}

@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise 360ms var(--ease-out) both}
  .rise:nth-child(2){animation-delay:50ms} .rise:nth-child(3){animation-delay:100ms} .rise:nth-child(4){animation-delay:150ms}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .press:active,.seg button:active{transform:none}
  .body,.chev,.nav .ind,.mark .feat{transition-duration:0ms}
}
@media (prefers-reduced-transparency:reduce){.bar{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (max-width:860px){.score{grid-template-columns:1fr}.zcols{grid-template-columns:1fr}}
@media (max-width:520px){.verdict{grid-template-columns:1fr}.point>button{grid-template-columns:1fr}.point .chips{justify-content:flex-start}.mark .feat{display:none}.part{padding:16px}}
</style>

the last copy is gone within 30 days plus that period; the approved summary is kept as a separate entry.", "The review screen shows the draft next to the transcript; the psychologist can reject the draft and write the note by hand, and the approving psychologist is responsible for the final note.", "Each opening of a transcript or draft in the review screen is logged per user and client, as part of the AREA-DOSSIER logging.", "The approved summary is documentation only: the feature takes no decision about the client."], "area_controls": [{"area": "AREA-PROC", "controls": ["The feature is switched on per clinic only after the clinic has authorised Google Vertex AI as sub-processor for this processing in its processor agreement with Aweris.", "Changes to the model provider or region are announced to each clinic in advance, with a chance to object, before they take effect.", "Model calls carry the transcript only for the clinic's instruction to draft a summary; no use for Aweris purposes, no training or fine-tuning (P1-data-role, P9-ai-use).", "The Vertex AI project is configured for europe-west4 data residency, with the machine-learning processing location set to the EU (vt-google-cloud-service-specific-terms, AI/ML data location; Assured Workloads where data in use must stay in the EU), and with prompt logging and caching disabled (vt-google-gemini-agent-platform-zero-data-retention; vt-google-cloud-cdpa 10.1).", "Transcripts, drafts and summaries are encrypted in transit and at rest, kept in tenant-isolated storage, and visible only to the treating psychologist and roles the clinic sets.", "Every draft (the model output and its unapproved edits), approved or not, is removed automatically from active storage 30 days after it was generated; the approved summary is a separate entry in the client file. Backups that may hold drafts are kept for a maximum number of days that SECURITY_OFFICER sets and records in the security description, so the last backup copy of a draft in the processor agreement annex with the purpose the clinic states for it; a clinic can set a shorter period, and a written hold instruction from the clinic pauses deletion of the drafts it names until the clinic lifts it."]}, {"area": "AREA-HEALTH", "controls": ["The feature is offered as an aid to the clinic's own record-keeping for the treating psychologist only; no other use of the transcript is made.", "Only persons under a professional or contractual duty of secrecy (psychologists, Aweris staff with confidentiality undertakings, Google under its data processing terms) handle the transcripts.", "A clinic-level and client-level switch lets the clinic leave out clients for whom it decides not to use the feature.", "Aweris supplies clinics with a privacy statement text that names the summary step and the model provider as recipient category.", "The psychologist's review lets the psychologist leave out details about other persons (partners, relatives) that the note does not need.", "The saved summary is used as dossier documentation only; the feature feeds no automated decision about the client.", "Where the clinic acts towards the representative of an adult client who cannot reasonably judge their interests, the client-level switch and the information to the client follow the clinic's record of that representative (wgbo#art_465).", "The summary step cannot be switched on for a clinic until the clinic confirms in the admin settings that its DPIA for the summary step is done; Aweris supplies the DPIA support pack first."]}, {"area": "AREA-AI", "controls": ["Every draft carries a machine-readable marker that it was generated by AI, and the screen labels it as an AI draft until the psychologist approves it.", "The saved summary keeps a provenance flag that it started as an AI draft and was edited and approved by a named psychologist.", "Aweris staff who build and support the feature, and clinic users, receive AI literacy material on the limits of model summaries (omissions, invented content).", "The prompt asks for a summary of the session only and blocks diagnoses, scores, risk ratings and treatment advice; prompt changes are reviewed before release.", "Only the text transcript is sent to the model; no audio, voice features, images or video."]}, {"area": "AREA-QUALITY", "controls": ["Before release and after each model or prompt change, drafts are evaluated against written acceptance criteria for omissions, invented statements and speaker attribution, and the results are shared with clinics so they can judge the tool for their care.", "Clinic user material explains the limits of model drafts and that the approving psychologist stays responsible for the note."]}, {"area": "AREA-DOSSIER", "controls": ["Nothing enters the client file without the psychologist's approval; at approval the psychologist checks that the summary holds only what good care needs and removes the rest; the saved entry records the approving psychologist and the date.", "Approved summaries are kept for the retention period the clinic sets: at least twenty years from the last change, or longer as the clinic instructs where good care requires it; they are deleted earlier only on the clinic's instruction, such as a client's destruction request the clinic has accepted, or after a confirmed export to its EPD.", "Reads and writes of transcripts, drafts and summaries, including each opening in the review screen, are logged per user and client, and the logs are available to the clinic. The logs are used for security and the clinic's access checks, not to monitor staff performance; another use needs the clinic's own decision.", "The clinic can export an approved summary to its EPD with its approval data (approving psychologist, date, AI provenance flag); deletion after export happens only after the clinic confirms the summary is in its EPD, and a failed or unconfirmed export keeps the summary in the platform.", "On the clinic's instruction after a client's destruction request, Aweris deletes the saved summary and any remaining drafts of that session and confirms the deletion to the clinic.", "The clinic can retrieve and export all saved summaries of a client to answer an access or copy request, as an electronic copy at no charge to the client, with, at the client's request, the access log entries showing who viewed or requested them and when; the clinic can leave out passages before release where another person's privacy requires it."]}], "switched_off": ["AREA-MD", "AREA-CYBER", "AREA-DEVICE", "AREA-CRA"], "alternative": "Keep the review step as designed and settle the intended-purpose statement (GQ-MDR), the health data ground (GQ-GROUND), the confidentiality reading (GQ-CONF), whether the platform file is a care information system (GQ-BEGZ), the transfer review (GQ-TRANSFER), Aweris's own Cbw status (GQ-CBW-AWERIS) and the CRA reading (GQ-CRA) before release.", "needs": ["GQ-MDR", "GQ-CONF", "GQ-GROUND", "GQ-BEGZ", "GQ-TRANSFER", "GQ-CYBER", "GQ-DEVICE", "GQ-CRA", "GQ-CBW-AWERIS", "GQ-ART50"]}, {"id": "SAVE-SUMMARY", "zone": "GRAY", "conditional_zone": "GREEN", "role": "REQUIRED_COMPONENT", "areas": ["AREA-PROC", "AREA-HEALTH", "AREA-DOSSIER", "AREA-MD", "AREA-CYBER", "AREA-DEVICE", "AREA-CRA"], "name": "Saving the approved summary in the client file", "what": "Saves only the approved summary in the client's file in the platform, with the approving psychologist and the date.", "why": "Under the assumptions it can be built. The laws allow it with access logging, a retention period you set or export to your EPD, and a security description. It rests on the stated purpose, the care ground, the file being part of your care information system and the EU transfer check.", "assumes": {"GQ-MDR": 0, "GQ-CONF": 0, "GQ-GROUND": 0, "GQ-BEGZ": 0, "GQ-CYBER": 0, "GQ-DEVICE": 0, "GQ-TRANSFER": 0, "GQ-CRA": 0, "GQ-CBW-AWERIS": 0}, "conditions": ["Signed intended-purpose statement", "Claim review of UI and sales text", "Prompt blocks diagnoses, scores, risk ratings and treatment advice", "Processor agreements with confidentiality clauses", "Clients informed of the summary step", "Clinic decision record on the health data ground", "Secrecy undertakings for Aweris staff and the model provider", "Clinic DPIA for the summary step completed before switch-on, supported by Aweris's DPIA support pack", "Logging of reads and writes per user and client, including model calls on transcripts and openings in the review screen, checked against NEN 7513", "Security description for the clinic's NEN 7510 and NEN 7512 duties", "Clinic size and designation status checked at onboarding", "Device storage list kept with the release", "Transfer review record on file", "EU data residency and EU machine-learning processing configured", "Counsel note on file", "Reading checked again if Aweris ships an installable app, SDK or on-premise build", "Record of Aweris's own Cbw status, re-checked yearly and when it passes the micro-enterprise thresholds", "Retention of approved summaries for the period the clinic sets, or export to its EPD after confirmed transfer."], "controls": ["Saved entries record the approving psychologist and date and keep the AI provenance flag.", "Reads and writes are logged per user and client.", "Export to the clinic EPD is available.", "Saved summaries are deleted early only on the clinic's instruction (destruction request or confirmed export)."], "area_controls": [{"area": "AREA-PROC", "controls": ["The feature is switched on per clinic only after the clinic has authorised Google Vertex AI as sub-processor for this processing in its processor agreement with Aweris.", "Changes to the model provider or region are announced to each clinic in advance, with a chance to object, before they take effect.", "Model calls carry the transcript only for the clinic's instruction to draft a summary; no use for Aweris purposes, no training or fine-tuning (P1-data-role, P9-ai-use).", "The Vertex AI project is configured for
